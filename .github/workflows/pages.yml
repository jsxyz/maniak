name: pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: site
      - name: Add the test branch
        run: |
          [ -e site/404.html ] || printf '<!doctype html><meta charset="utf-8"><title>404</title>\n' > site/404.html
          if git -C site fetch --depth 1 origin test; then
            mkdir tb && git -C site archive FETCH_HEAD | tar -x -C tb
            if [ -d tb/test ]; then cp -r tb/test site/test; fi
            if [ -d tb/assets ]; then cp -r --update=none tb/assets/. site/assets/; fi
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
