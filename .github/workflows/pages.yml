name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        continue-on-error: true
        with:
          ref: test
          path: test-branch
      - name: Assemble
        run: |
          if [ -d test-branch/test ]; then cp -r test-branch/test site/test; fi
          if [ -d test-branch/assets ]; then cp -r --update=none test-branch/assets/. site/assets/; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
